<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Shoplifting Detection System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .error-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
            text-align: center;
        }
        
        .error-icon {
            font-size: 6rem;
            color: var(--danger);
            margin-bottom: 2rem;
            animation: shake 0.5s ease-in-out;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        
        .error-code {
            font-size: 4rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 1rem;
        }
        
        .error-message {
            font-size: 1.5rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }
        
        .error-description {
            color: var(--text-muted);
            margin-bottom: 3rem;
            max-width: 500px;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <i class="fas fa-exclamation-triangle error-icon"></i>
        <h1 class="error-code">{{ error_code or '500' }}</h1>
        <p class="error-message">{{ error_message or 'Something went wrong' }}</p>
        <p class="error-description">{{ error_description or 'An unexpected error occurred. Please try again.' }}</p>
        <a href="/" class="btn btn-primary btn-large">
            <i class="fas fa-home"></i> Back to Dashboard
        </a>
    </div>
</body>
</html>
