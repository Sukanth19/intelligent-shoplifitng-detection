# UCF-Crime Real Data Configuration
# Uses pre-extracted VideoSwin features in H5 format from MSL authors

experiment:
  name: "ucf_crime_msl_h5"
  output_dir: "results/ucf_crime"
  seed: 42

dataset:
  name: "UCF-Crime-H5"
  type: "h5"  # Use H5 loader
  
  train:
    h5_path: "../data/UCF-VideoSwin-Features/ucf_swin_train_feature_224288224288.h5"
    list_path: "../data/UCF-VideoSwin-Features/ucf-train-filter.list"
    gt_path: "../data/UCF-VideoSwin-Features/ucf_gt_16.npy"
  
  test:
    h5_path: "../data/UCF-VideoSwin-Features/ucf_swin_test_feature_224288224288.h5"
    list_path: "../data/UCF-VideoSwin-Features/ucf-test.list"
    gt_path: "../data/UCF-VideoSwin-Features/ucf_gt_16.npy"
  
  max_length: 100  # Reduced from 320 for faster processing
  num_workers: 0  # Set to 0 for Windows compatibility
  pin_memory: true

model:
  input_dim: 1024  # VideoSwin feature dimension
  hidden_dim: 512  # Transformer hidden dimension
  num_layers: 3  # Number of Transformer layers
  num_heads: 8  # Number of attention heads
  sequence_length: 32  # Initial sequence length for MSL
  sequence_stride: 16  # Initial stride for MSL
  dropout: 0.1
  aggregation: 'attention'  # Sequence aggregation method

loss:
  margin: 0.5  # Hinge loss margin
  weight_video: 1.0  # Video-level loss weight
  weight_snippet: 1.0  # Snippet-level loss weight

training:
  batch_size: 4  # Small batch for faster training (was 16)
  epochs: 50  # Total epochs
  learning_rate: 0.0001
  weight_decay: 0.0001
  warmup_epochs: 5
  
  optimizer: "adam"
  scheduler: "cosine"
  
  gradient_clip: 1.0
  mixed_precision: true  # Use AMP for faster training
  
  checkpoint_dir: "checkpoints"
  checkpoint_interval: 5  # Save every N epochs
  
  log_interval: 10  # Log every N batches
  tensorboard_dir: "logs"
  
  early_stopping:
    enabled: true
    patience: 10
    min_delta: 0.001

logging:
  log_file: "logs/training.log"
  level: "INFO"
  tensorboard: true

self_training:
  enabled: false  # Start with single-stage training
  stages:
    - name: "stage1"
      sequence_length: 64
      stride: 32
      epochs: 15
      learning_rate: 0.0001
    
    - name: "stage2"
      sequence_length: 48
      stride: 24
      epochs: 15
      learning_rate: 0.00005
    
    - name: "stage3"
      sequence_length: 32
      stride: 16
      epochs: 20
      learning_rate: 0.00001

inference:
  score_correction:
    method: 'linear'  # 'linear', 'multiplicative', 'threshold', 'none'
    alpha: 0.5  # Linear blending factor
  
  temporal_smoothing:
    enabled: true
    window_size: 5
    method: 'gaussian'  # 'gaussian', 'uniform', 'median'
  
  anomaly_threshold: 0.5  # Detection threshold

evaluation:
  metrics:
    - 'accuracy'
    - 'precision'
    - 'recall'
    - 'f1'
    - 'auc'
    - 'ap'
  
  save_predictions: true
  save_plots: true
  
device: "cuda"  # 'cuda' or 'cpu'
